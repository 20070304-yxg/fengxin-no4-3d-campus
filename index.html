<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>奉新四中 3D校园</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Microsoft YaHei",sans-serif}
  #tip{position:fixed;left:10px;top:10px;color:#fff;background:rgba(0,0,0,.45);
       padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.6;z-index:10}
</style>
</head>
<body>
<div id="tip">
  <b>奉新四中 · 3D校园 v0.1</b><br>
  左键拖动 = 旋转视角　滚轮 = 缩放　右键拖动 = 平移<br>
  底图：奥维·吉林一号 2025/11
</div>
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
// ====== 1. 基础场景 ======
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec5e8);
scene.fog = new THREE.Fog(0x9ec5e8, 1500, 4000);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 8000);
camera.position.set(0, 700, 900);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI/2.1;
controls.target.set(0, 0, 0);

// 灯光
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(400, 800, 300);
sun.castShadow = true;
sun.shadow.camera.left = -800; sun.shadow.camera.right = 800;
sun.shadow.camera.top = 800; sun.shadow.camera.bottom = -800;
scene.add(sun);

// ====== 2. 地面 = 卫星底图 ======
// 像素→米：截图里 50m ≈ 70px
const SCALE = 50/70;            // m / px
const IMG_W = 1588, IMG_H = 873; // 裁后图片像素
const W = IMG_W*SCALE, H = IMG_H*SCALE;

const tex = new THREE.TextureLoader().load('底图.png');
tex.anisotropy = 8;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(W, H),
  new THREE.MeshLambertMaterial({map: tex})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 像素坐标转世界坐标（图片左上角=像素原点，y 向下）
function P(px, py){
  return new THREE.Vector3((px-IMG_W/2)*SCALE, 0, (py-IMG_H/2)*SCALE);
}

// ====== 3. 摆楼 ======
// 每项: [中心x, 中心y(像素), 宽px, 高px, 楼高m, 颜色]
const BUILDINGS = [
  // 左侧宿舍楼群（深色屋顶，6层约20m）
  [295, 345, 95, 85, 20, 0x8a8a8a],
  [295, 445, 95, 85, 20, 0x8a8a8a],
  [295, 555, 95, 85, 20, 0x8a8a8a],
  [295, 665, 95, 90, 20, 0x8a8a8a],
  [380, 345, 60, 80, 15, 0x9a9a9a],
  // 左下角蓝色小楼
  [195, 655, 70, 110, 9, 0x7fb3d5],
  // 北侧三栋教学楼
  [510, 210, 110, 90, 22, 0xb0a89c],
  [645, 210, 110, 90, 22, 0xb0a89c],
  [820, 210, 120, 90, 22, 0xb0a89c],
  // 中部连廊 + 主U型教学楼
  [580, 330, 240, 50, 18, 0xc2b8a8],
  [580, 470, 240, 170, 22, 0xc2b8a8],
  // 南侧行政/实验楼
  [580, 615, 240, 80, 18, 0xc2b8a8],
  // 体育馆（大白顶）
  [1035, 620, 160, 110, 13, 0xd8d8d8],
];

BUILDINGS.forEach(([cx, cy, w, h, height, color])=>{
  const geo = new THREE.BoxGeometry(w*SCALE, height, h*SCALE);
  const mat = new THREE.MeshLambertMaterial({color: color});
  const m = new THREE.Mesh(geo, mat);
  const p = P(cx, cy);
  m.position.set(p.x, height/2, p.z);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  // 屋顶略深
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(w*SCALE*1.01, 1.5, h*SCALE*1.01),
    new THREE.MeshLambertMaterial({color: 0x555555})
  );
  roof.position.set(p.x, height+0.75, p.z);
  roof.castShadow = true;
  scene.add(roof);
});

// ====== 4. 动画循环 ======
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
